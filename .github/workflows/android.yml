name: Queen Alina APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One release publish at a time, so the stable download always points to the newest successful build.
concurrency:
  group: queen-alina-publish
  cancel-in-progress: false

env:
  APK_NAME: Queen-Alina.apk
  RELEASE_TAG: android-latest
  # SHA-256 of the signing certificate used by every installed build. A different key would block updates.
  EXPECTED_CERT_SHA256: bc885dda4aad6ec82f573b69ce7fb383c6e2c1641e440bba65f5a139f03cd110

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set version from the workflow run
        run: |
          # Run numbers only grow, so versionCode always increases. The offset keeps it above earlier test builds.
          echo "ALINA_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ALINA_VERSION_NAME=0.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/alina-release.keystore"
          echo "ALINA_KEYSTORE_FILE=$RUNNER_TEMP/alina-release.keystore" >> "$GITHUB_ENV"
      - name: Test levels and saved stars
        run: |
          mkdir -p build/rule-tests
          javac --release 17 -encoding UTF-8 -d build/rule-tests app/src/main/java/nl/alina/tovertuin/GameRules.java tools/GameRulesTest.java
          java -cp build/rule-tests nl.alina.tovertuin.GameRulesTest
          node tools/check-levels.js
          python3 tools/build-web.py --check
          node tools/check-lessons.js
      - name: Build, compile device tests and lint
        env:
          ALINA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALINA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALINA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Verify signature and version
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256/ {print $2}' | tr -d ' ')
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then echo "::error::Unexpected signing key: $CERT"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" | grep -E "package: name='nl.alina.tovertuin' versionCode='$ALINA_VERSION_CODE'"
          cp "$APK" "$APK_NAME"
      - name: Upload checked APK
        uses: actions/upload-artifact@v4
        with:
          name: Queen-Alina-apk
          path: |
            Queen-Alina.apk
            app/build/reports/lint-results-debug.html
          retention-days: 30

  publish:
    # Runs only after every check above passed, on main, and replaces the APK behind the stable link.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Queen-Alina-apk
          path: release
      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="release/$APK_NAME"
          test -s "$APK"
          NOTES="Queen Alina: Leer & Speel. Build $GITHUB_RUN_NUMBER (commit ${GITHUB_SHA:0:7}). Tik op de APK-link op een Android-telefoon of -tablet en open $APK_NAME. Android vraagt om toestemming om apps van deze bron te installeren; updates installeer je over de bestaande app heen."
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
            gh release edit "$RELEASE_TAG" --title "Queen Alina: Leer & Speel (actueel)" --notes "$NOTES" --latest --prerelease=false
          else
            gh release create "$RELEASE_TAG" "$APK" --title "Queen Alina: Leer & Speel (actueel)" --notes "$NOTES" --latest
          fi
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft,assets --jq '{tagName,isPrerelease,isDraft,assets:[.assets[].name]}'
